# SPDX-License-Identifier: MIT
# Python environment of the ICF target chamber example (mesh, cross sections, OpenMC reference,
# comparison and figures). OpenSn itself is built separately. Create it with
#     conda env create -f environment.yml
# OpenMC is the build without MPI, which uses OpenMP threads.
name: chamber
channels:
  - conda-forge
dependencies:
  - python=3.13
  - openmc=0.16.0=nodagmc_nompi*
  - gmsh=4.15.2
  - python-gmsh=4.15.2
  - meshio=5.3.5
  - numpy=2.5.4
  - scipy=1.18.1
  - h5py=3.16.0
  - matplotlib=3.11.2
  - pyvista=0.49.2
  - flake8=7.5.0
