name: Nightly Tests

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches:
      - main

jobs:
  run-tests:
    runs-on: [self-hosted]
    strategy:
      fail-fast: false
    steps:
      - name: checkout examples
        uses: actions/checkout@v4
      - name: checkout opensn
        uses: actions/checkout@v4
        with:
          repository: Open-Sn/opensn
          path: opensn
      - name: compile opensn
        shell: bash
        run: |
          module purge
          module load python3/3.12.3 opensn/clang/17 openfoam-precice/14-3.4.1
          cmake -S opensn -B opensn/build \
            -DOPENSN_WITH_PYTHON_MODULE=ON \
            -DOPENSN_WITH_PRECICE=ON
          cmake --build opensn/build --parallel
      - name: test examples
        shell: bash
        env:
          CASL_CASES: 2A,2B,2D,2F,2G,2H,2K,2N,2P,2Q
        run: |
          module purge
          # OpenSn links libprecice, which only this module puts on the library path.
          module load python3/3.12.3 opensn/clang/17 openfoam-precice/14-3.4.1
          export OPENSN=$PWD/opensn/build/python/opensn
          python3 test.py
      - name: test OpenSn-OpenFOAM coupling
        shell: bash
        run: |
          module purge
          module load python3/3.12.3 opensn/clang/17 openfoam-precice/14-3.4.1
          export OPENSN="$PWD/opensn/build/python/opensn"
          OpenFOAM_Electron_Converter/openfoam_adapter/tests/run.sh
          OpenFOAM_Electron_Converter/run_coupled_test.sh
